<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facilitador RCM — Demo</title>
<!-- Icono embebido: sin esto el navegador pide /favicon.ico y se lleva un 401. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4E78'/%3E%3Ctext x='16' y='23' font-size='18' font-family='Helvetica,Arial' font-weight='bold' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<style>
  :root { --brand:#1F4E78; --bg:#f6f7f9; --user:#1F4E78; --bot:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:#1a1a1a; height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:14px 18px; font-weight:600;
           display:flex; align-items:center; gap:10px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  header .dot { width:9px; height:9px; border-radius:50%; background:#8bd450; }
  header small { font-weight:400; opacity:.85; font-size:12px; }
  header .acciones { margin-left:auto; display:flex; gap:8px; flex:none; }
  header .acciones button { background:transparent; border:1px solid rgba(255,255,255,.55);
           color:#fff; font-size:12px; font-weight:500; padding:6px 11px; border-radius:9px;
           white-space:nowrap; }
  header .acciones button:hover:not(:disabled) { background:rgba(255,255,255,.14); }
  header .acciones button:disabled { opacity:.6; }
  #exportar { border-color:rgba(255,255,255,.85) !important; }
  /* En el teléfono el encabezado se queda sin sitio: el subtítulo es lo
     prescindible, los botones no. */
  @media (max-width:560px) {
    header { padding:12px 12px; gap:8px; }
    header small { display:none; }
    header .acciones button { padding:6px 9px; }
  }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(680px,88%); padding:11px 14px; border-radius:14px; line-height:1.45;
         word-wrap:break-word; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  /* El usuario escribe texto plano: sus saltos de línea se respetan tal cual.
     El bot se renderiza como bloques, y ahí pre-wrap duplicaría el espaciado. */
  .user, .meta, .hint { white-space:pre-wrap; }
  .bot { white-space:normal; }
  .bot p { margin:.45em 0; }
  .bot p:first-child { margin-top:0; }
  .bot p:last-child { margin-bottom:0; }
  .bot ul, .bot ol { margin:.45em 0; padding-left:1.4em; }
  .bot li { margin:.15em 0; }
  .bot .md-h { font-weight:600; margin:.6em 0 .2em; }
  .bot .md-h:first-child { margin-top:0; }
  .bot code { background:#eef1f4; padding:1px 5px; border-radius:5px;
              font-size:.92em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .bot pre { background:#eef1f4; padding:9px 11px; border-radius:9px; overflow-x:auto; margin:.45em 0; }
  .bot pre code { background:none; padding:0; }
  .bot a { color:var(--brand); text-decoration:underline; }
  .bot hr { border:0; border-top:1px solid #e3e7ec; margin:.7em 0; }
  .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .bot h1,.bot h2,.bot h3 { font-size:1em; margin:.4em 0 .2em; }
  .meta { align-self:center; font-size:12px; color:#888; }
  .tools { align-self:flex-start; font-size:12px; color:#6a7; background:#eefaef;
           padding:4px 10px; border-radius:10px; }
  form { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #e6e6e6; }
  #inp { flex:1; padding:12px 14px; border:1px solid #d0d5db; border-radius:12px; font-size:15px;
         resize:none; max-height:120px; font-family:inherit; }
  button { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:0 18px;
           font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:#c0392b; }
  .hint { align-self:center; color:#999; font-size:13px; text-align:center; max-width:520px; }
</style>
</head>
<body>
<header>
  <span class="dot"></span> Facilitador RCM
  <small>Análisis RCM asistido</small>
  <span class="acciones">
    <button id="exportar" type="button" title="Descarga el Excel con lo registrado hasta ahora">Descargar Excel</button>
    <button id="nuevo" type="button" title="Descarta esta conversación y empieza un análisis desde cero">Nuevo análisis</button>
  </span>
</header>
<div id="log">
  <div class="hint" id="hint">Cuéntele al facilitador qué equipo quiere analizar. Por ejemplo:
  «Hola, soy Carlos de mantenimiento. Queremos hacer el análisis RCM de la bomba P-101.»</div>
</div>
<form id="f">
  <textarea id="inp" rows="1" placeholder="Escriba su mensaje…" autocomplete="off"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<script>
(function(){
  var log = document.getElementById('log');
  var inp = document.getElementById('inp');
  var send = document.getElementById('send');
  var form = document.getElementById('f');
  var hint = document.getElementById('hint');
  var nuevo = document.getElementById('nuevo');
  var exportar = document.getElementById('exportar');
  var params = new URLSearchParams(location.search);
  var key = params.get('key') || '';

  // Continuidad de sesión: ?session= manda, si no el último id guardado en este
  // navegador, si no uno nuevo. El id se valida antes de usarse (viene de la URL).
  var STORE = 'rcm-demo-session';
  var SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
  function guardado(clave){ try { return localStorage.getItem(clave || STORE) || ''; } catch(e){ return ''; } }
  function recordar(id){ try { localStorage.setItem(STORE, id); return true; } catch(e){ return false; } }
  // Id impredecible: con una sola llave compartida entre invitados, un id corto
  // y adivinable deja leer el análisis de otro.
  function nuevoId(){
    try { return 'demo-' + crypto.randomUUID(); } catch(e){}
    return 'demo-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
  var deUrl = params.get('session') || '';
  var previa = [deUrl, guardado()].find(function(id){ return SAFE_ID.test(id); }) || '';
  var sessionId = previa || nuevoId();
  // La barra de direcciones queda siempre con el enlace que retoma esta sesión,
  // así copiarla del teléfono a la computadora continúa el mismo análisis.
  if (params.get('session') !== sessionId) {
    params.set('session', sessionId);
    try { history.replaceState(null, '', location.pathname + '?' + params.toString()); } catch(e){}
  }

  // Descartar es de un solo toque en un header estrecho: se confirma, y el id
  // saliente queda guardado para poder volver. Se usa location.replace para no
  // dejar entrada en el historial: con Atrás volvería el ?session= viejo, que
  // tiene precedencia, y el "análisis nuevo" se deshace solo.
  nuevo.addEventListener('click', function(){
    if(!confirm('¿Empezar un análisis nuevo? El actual queda guardado, pero saldrá de la pantalla.')) return;
    try { localStorage.setItem(STORE + '-previa', sessionId); localStorage.removeItem(STORE); } catch(e){}
    params.delete('session');
    var q = params.toString();
    location.replace(location.pathname + (q ? '?' + q : ''));
  });

  // Descarga el entregable sin pasar por el facilitador. La llave viaja en la
  // cabecera y el archivo se recibe como blob: así la llave nunca entra en una
  // URL, que acabaría en el historial del navegador. El nombre lo decide el
  // servidor (Content-Disposition), porque aquí no se conoce el TAG del equipo.
  exportar.addEventListener('click', async function(){
    if(!key){ note('meta err', 'Falta la llave de acceso en el enlace.'); return; }
    exportar.disabled = true;
    var etiqueta = exportar.textContent;
    exportar.textContent = 'Generando…';
    try {
      var r = await fetch('/exports/' + encodeURIComponent(sessionId), {
        headers: { 'Authorization': 'Bearer ' + key }
      });
      if(!r.ok){
        // El servidor ya explica en español qué pasó; un número de error suelto
        // no le dice nada a quien está usando esto.
        var d = await r.json().catch(function(){ return {}; });
        var esFalta = r.status === 404;
        note(esFalta ? 'meta' : 'meta err',
          d.detail || (esFalta ? 'Todavía no hay nada que exportar.'
                               : 'No se pudo generar el Excel. Intente de nuevo.'));
        return;
      }
      var nombre = 'AMEF.xlsx';
      var cd = r.headers.get('Content-Disposition') || '';
      var m = cd.match(/filename="?([^";]+)"?/);
      if(m) nombre = m[1];
      var blob = await r.blob();
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
      note('meta', 'Descargado: ' + nombre +
        (nombre.indexOf('BORRADOR_') === 0
          ? ' — es un borrador: el análisis aún no está completo.'
          : ''));
    } catch(err) {
      console.warn('exportar', err);
      note('meta err', 'No se pudo descargar. Verifique su conexión e intente de nuevo.');
    } finally {
      exportar.disabled = false; exportar.textContent = etiqueta;
    }
  });

  // ---- Markdown -----------------------------------------------------------
  // Se construye con nodos DOM, nunca con innerHTML. El texto viene del modelo,
  // que a su vez repite lo que escribe el usuario, así que sanear una cadena
  // sería una carrera que se pierde; creando nodos, el XSS no existe por
  // construcción: un "<img onerror=…>" solo puede acabar siendo texto.
  var RE_ENLINEA = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\n]+\*)|(_[^_\n]+_)|(\[[^\]\n]+\]\([^)\s]+\))/;
  var RE_ORD = /^\s*\d+[.)]\s+/;
  var RE_VIN = /^\s*[-*•]\s+/;

  // Solo estos destinos son clicables. Deja fuera javascript:, data: y file:,
  // que son el vector real de un enlace de markdown.
  function urlPermitida(u){
    return /^https?:\/\//i.test(u) || u.indexOf('/exports/') === 0;
  }

  function nodoTexto(t){ return document.createTextNode(t); }

  function enLinea(texto, destino){
    var resto = String(texto);
    while(resto){
      var m = RE_ENLINEA.exec(resto);
      if(!m){ destino.appendChild(nodoTexto(resto)); return; }
      if(m.index) destino.appendChild(nodoTexto(resto.slice(0, m.index)));
      var t = m[0], el = null;
      if(t.charAt(0) === '`'){
        el = document.createElement('code'); el.textContent = t.slice(1, -1);
      } else if(t.slice(0, 2) === '**'){
        el = document.createElement('strong'); enLinea(t.slice(2, -2), el);
      } else if(t.charAt(0) === '*' || t.charAt(0) === '_'){
        el = document.createElement('em'); enLinea(t.slice(1, -1), el);
      } else {
        var mm = /^\[([^\]]+)\]\(([^)\s]+)\)$/.exec(t);
        if(mm && urlPermitida(mm[2])){
          el = document.createElement('a');
          el.href = mm[2]; enLinea(mm[1], el);
          if(/^https?:/i.test(mm[2])){ el.target = '_blank'; el.rel = 'noopener noreferrer'; }
        } else {
          el = nodoTexto(t);  // esquema no permitido: se queda como texto
        }
      }
      destino.appendChild(el);
      resto = resto.slice(m.index + t.length);
    }
  }

  function markdown(texto, destino){
    var lineas = String(texto).replace(/\r\n/g, '\n').split('\n');
    var i = 0;
    while(i < lineas.length){
      var l = lineas[i];
      if(/^\s*$/.test(l)){ i++; continue; }
      if(/^\s*```/.test(l)){                     // bloque cercado
        i++;
        var codigo = [];
        while(i < lineas.length && !/^\s*```/.test(lineas[i])){ codigo.push(lineas[i]); i++; }
        i++;                                     // salta el cierre
        var pre = document.createElement('pre');
        var cod = document.createElement('code');
        cod.textContent = codigo.join('\n');
        pre.appendChild(cod); destino.appendChild(pre);
        continue;
      }
      if(/^\s*([-*_])\s*\1\s*\1[-*_\s]*$/.test(l)){   // línea horizontal: --- *** ___
        destino.appendChild(document.createElement('hr'));
        i++; continue;
      }
      var h = /^\s*(#{1,6})\s+(.*)$/.exec(l);
      if(h){
        var t = document.createElement('div');
        t.className = 'md-h'; enLinea(h[2], t);
        destino.appendChild(t); i++; continue;
      }
      if(RE_ORD.test(l) || RE_VIN.test(l)){
        var ord = RE_ORD.test(l), re = ord ? RE_ORD : RE_VIN;
        var lista = document.createElement(ord ? 'ol' : 'ul');
        while(i < lineas.length && re.test(lineas[i])){
          var li = document.createElement('li');
          enLinea(lineas[i].replace(re, ''), li);
          lista.appendChild(li); i++;
        }
        destino.appendChild(lista); continue;
      }
      var parrafo = [];
      while(i < lineas.length && !/^\s*$/.test(lineas[i]) && !/^\s*```/.test(lineas[i])
            && !/^\s*#{1,6}\s/.test(lineas[i]) && !RE_ORD.test(lineas[i]) && !RE_VIN.test(lineas[i])){
        parrafo.push(lineas[i]); i++;
      }
      var p = document.createElement('p');
      parrafo.forEach(function(linea, k){
        if(k) p.appendChild(document.createElement('br'));
        enLinea(linea, p);
      });
      destino.appendChild(p);
    }
  }

  // agno concatena los mensajes del asistente sin separador cuando el turno
  // lleva llamada a herramienta: "…un resumen rápido:**Resumen:**". Los mensajes
  // propios del turno son, por definición, los posteriores al último 'user', así
  // que separarlos es exacto y no una heurística.
  function textoDelRun(run){
    var msgs = (run && run.messages) || [];
    var propios = [];
    for(var i = msgs.length - 1; i >= 0; i--){
      if(msgs[i].role === 'user') break;
      if(msgs[i].role === 'assistant' && typeof msgs[i].content === 'string'
         && msgs[i].content.trim()){
        propios.unshift(msgs[i].content.trim());
      }
    }
    if(propios.length) return propios.join('\n\n');
    return typeof run.content === 'string' ? run.content.trim() : '';
  }

  function pinta(cls, text, destino){
    var d = document.createElement('div');
    d.className = cls;
    // Solo el bot lleva markdown: lo del usuario y los avisos son texto plano,
    // y no hay nada que ganar dándoles una superficie de ataque.
    if(cls.indexOf('msg bot') === 0){
      try { markdown(text, d); }
      catch(e){ console.warn('markdown', e); d.textContent = text; }
    } else {
      d.textContent = text;
    }
    (destino || log).appendChild(d);
    if(!destino){ log.scrollTop = log.scrollHeight; }
    return d;
  }
  function add(cls, text, destino){ return pinta('msg ' + cls, text, destino); }
  function note(cls, text){ return pinta(cls, text); }
  if(!key){ note('meta err', 'Falta la llave de acceso en el enlace (?key=...). Pídala a quien le compartió esta demo.'); send.disabled = true; }
  if(deUrl && !SAFE_ID.test(deUrl)){ note('meta', 'El identificador del enlace no es válido; abrimos un análisis nuevo.'); }
  if(!recordar(sessionId)){ note('meta', 'Su navegador no guarda la sesión (¿modo privado?). Conserve este enlace tal como está para poder continuar.'); }

  // Salida de emergencia del botón "Nuevo análisis": sin esto el id descartado
  // se guardaba y nadie lo leía nunca, así que un toque de más dejaba el
  // análisis anterior inalcanzable desde la pantalla.
  var descartada = guardado(STORE + '-previa');
  if(!previa && SAFE_ID.test(descartada)){
    var aviso = note('meta', 'Tiene un análisis anterior guardado. ');
    var volver = document.createElement('a');
    volver.href = '#'; volver.textContent = 'Volver a él';
    volver.addEventListener('click', function(e){
      e.preventDefault();
      params.set('session', descartada);
      location.replace(location.pathname + '?' + params.toString());
    });
    aviso.appendChild(volver);
  }

  // Repinta lo ya conversado. Sin esto el agente recuerda el análisis pero la
  // pantalla aparece vacía, y el usuario cree que perdió su trabajo.
  // El envío se bloquea mientras carga: si no, en una red lenta el usuario
  // escribe primero y su mensaje queda sepultado bajo la conversación vieja.
  var yaEscribio = false;
  async function pintarHistorial(){
    if(!key || !previa) return;
    send.disabled = true;
    var cargando = note('meta', 'Recuperando su análisis anterior…');
    try {
      var r = await fetch('/sessions/' + encodeURIComponent(sessionId) + '/runs', {
        headers: { 'Authorization': 'Bearer ' + key }
      });
      cargando.remove();
      if(r.status === 404){ note('meta', 'No encontramos un análisis anterior con este enlace. Empezamos uno nuevo.'); return; }
      if(r.status === 401){ note('meta err', 'La llave del enlace no es válida. Pida un enlace nuevo.'); return; }
      if(!r.ok){ note('meta err', 'No pudimos recuperar su conversación anterior (error ' + r.status + '). Su análisis sigue guardado.'); return; }
      var runs = await r.json();
      if(!Array.isArray(runs) || !runs.length) return;
      if(yaEscribio) return;  // el usuario se adelantó; no le movemos la pantalla
      hint.remove();
      var trozo = document.createDocumentFragment();
      runs.forEach(function(run){
        if(run.status && run.status !== 'COMPLETED') return;  // los runs con error no son respuestas
        if(typeof run.run_input === 'string') add('user', run.run_input, trozo);
        var salida = textoDelRun(run);
        if(salida) add('bot', salida, trozo);
      });
      log.appendChild(trozo);
      note('meta', '— Hasta aquí su conversación anterior. Puede seguir escribiendo. —');
    } catch(err) {
      cargando.remove();
      console.warn('historial', err);
      note('meta err', 'No pudimos recuperar su conversación anterior. Su análisis sigue guardado; recargue en un momento.');
    } finally {
      send.disabled = false; inp.focus();
    }
  }
  pintarHistorial();

  inp.addEventListener('input', function(){ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }});

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var text = inp.value.trim();
    if(!text || send.disabled) return;
    yaEscribio = true;
    hint.remove();
    add('user', text);
    inp.value=''; inp.style.height='auto';
    send.disabled = true;
    var thinking = note('meta', 'El facilitador está escribiendo…');
    try {
      var fd = new FormData();
      fd.append('message', text);
      fd.append('stream', 'false');
      fd.append('session_id', sessionId);
      var r = await fetch('/agents/facilitador-rcm/runs', {
        method:'POST',
        headers: { 'Authorization': 'Bearer ' + key },
        body: fd
      });
      thinking.remove();
      if(r.status === 401){ note('meta err','Llave de acceso inválida. Pida un enlace nuevo.'); return; }
      if(!r.ok){ note('meta err','Error del servidor ('+r.status+'). Intente de nuevo en un momento.'); return; }
      var d = await r.json();
      var nTools = (d.tools && d.tools.length) || 0;
      if(nTools){ note('tools', '🔧 '+nTools+' herramienta(s) ejecutada(s)'); }
      add('bot', textoDelRun(d) || '(sin respuesta)');
    } catch(err) {
      thinking.remove();
      note('meta err', 'No se pudo conectar. Verifique su conexión e intente de nuevo.');
    } finally {
      send.disabled = false; inp.focus();
    }
  });
  inp.focus();
})();
</script>
</body>
</html>
